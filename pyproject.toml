[project]
name = "taskhub"
version = "0.1.0"
description = "TaskHub FastAPI sample app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiomysql>=0.2.0",
    "cryptography>=42.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.19.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "alembic"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
